name: Build Guix WSL2 image

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Guix cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/guix
          # use a key that (almost) never matches
          key: guix-cache-${{ github.sha }}
          restore-keys: |
            guix-cache-

      - uses: PromyLOPh/guix-install-action@v1
        with:
          path: ~/.cache/guix
          # use a key that (almost) never matches
          key: guix-cache-${{ github.sha }}
          restore-keys: |
            guix-cache-

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: cp "$(guix system image --image-type=wsl2 image.scm)" guix-wsl.tar.gz

      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: guix-wsl.tar.gz
          tag_name: hmmm
